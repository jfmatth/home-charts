machine:
  # network:
  #   interfaces:
  #   - deviceSelector:
  #       physical: true
  #     dhcp: true
  #     vip:
  #       ip: 192.168.100.201    # # `interfaces` is used to define the network interface configuration.

  network:
    interfaces:
      - interface: enx00155d01d559
        addresses:
          - 10.10.10.201/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.10.10.1
        mtu: 1500

        
  kubelet:
    extraArgs:
      rotate-server-certificates: true

cluster:
  extraManifests:
    # 
    # Gateway APIs
    - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.0/standard-install.yaml
    
    # Cert approver
    - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
    

  # Minecraft port range requirements
  apiServer:
    extraArgs:
      service-node-port-range: "20000-40000"

  allowSchedulingOnControlPlanes: true

  # 
  # Cilium
  # 
  # network:
  #   cni:
  #     name: none
  # proxy:
  #   disabled: true

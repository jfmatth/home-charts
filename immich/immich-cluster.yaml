apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
spec:
  # resources:
  #   requests:
  #     cpu: "125m"
  #     memory: "512Mi"

  #   limits:
  #     cpu: "2"
  #     memory: "2Gi"

  instances: 1

  storage:
    size: 5Gi

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
  #Immich uses advanced vector search for features like face recognition and semantic search.
  #Because of that, it requires PostgreSQL extensions that are not included in the default Postgres image.

  postgresql:
    shared_preload_libraries:
      - "vchord.so"

    # parameters:
    #   shared_buffers: "512MB"
    #   work_mem: "64MB"
    #   maintenance_work_mem: "128MB"
    #   effective_cache_size: "1GB"

  bootstrap:
    initdb:
      postInitApplicationSQL:
        - CREATE EXTENSION vchord CASCADE;
        - CREATE EXTENSION earthdistance CASCADE;
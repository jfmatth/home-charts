kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
  namespace: "datadog"
  annotations:
    agent.datadoghq.com/cluster-provider: talos
spec:
  global:
    clusterName: "omni-home"
    site: "us5.datadoghq.com"
    credentials:
      apiSecret:
        secretName: "datadog-secret"
        keyName: "api-key"


    # Gets rid of errors due to Talos Self-signed certs.
    kubelet:
      tlsVerify: false

  features:
    clusterChecks:
      enabled: true

    orchestratorExplorer:
      enabled: true
    
    logCollection:
      enabled: true
      containerCollectAll: true

  override:
    nodeAgent:
      containers:
        agent:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

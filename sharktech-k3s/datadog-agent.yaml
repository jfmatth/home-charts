kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
  namespace: "datadog"
spec:
  global:
    clusterName: "stk3s"
    site: "us5.datadoghq.com"
    credentials:
      apiSecret:
        secretName: "datadog-secret"
        keyName: "api-key"
  
  override:
    nodeAgent:
      containers:
        agent:
          securityContext:
            appArmorProfile:
              type: Unconfined
        process-agent:
          securityContext:
            appArmorProfile:
              type: Unconfined
        system-probe:
          securityContext:
            appArmorProfile:
              type: Unconfined
  features:
    clusterChecks:
      enabled: true
    orchestratorExplorer:
      enabled: true
    logCollection:
      enabled: true
      containerCollectAll: false
    liveProcessCollection:
      enabled: false
    processDiscovery:
      enabled: false
  
    serviceDiscovery:
      enabled: false
    npm:
      enabled: false
    cws:
      enabled: false
    cspm:
      enabled: false
    usm:
      enabled: false
    oomKill:
      enabled: false

    